version: 1
name: staminaburden
alias: sb
script: StaminaAndBurden
help: Stamina & Burden debug commands
subs:
  - name: getburden
    alias: gb
    func: GetBurdenDebug
    help: Show full burden data for an actor
    args:
      - name: actor
        type: Actor
        selected: true
        required: false
        help: Target actor (defaults to player if nothing selected)
  - name: isexhausted
    alias: ie
    func: IsExhausted
    help: Check if an actor is exhausted
    args:
      - name: actor
        type: Actor
        selected: true
        required: false
        help: Target actor (defaults to player if nothing selected)
  - name: getmaxweight
    alias: gw
    func: GetMaxEquippedWeight
    help: Get current max equipped weight
    args:
      - name: actor
        type: Actor
        selected: true
        required: false
        help: Target actor (defaults to player if nothing selected)
  - name: setmaxweight
    alias: sw
    func: SetMaxEquippedWeightOverride
    help: Set max equipped weight override (pass 0 to clear)
    args:
      - name: actor
        type: Actor
        selected: true
        required: false
        help: Target actor (defaults to player if nothing selected)
      - name: value
        type: float
        required: true
        help: New max equipped weight value (0 = clear override)
  - name: speedmult
    alias: sp
    func: GetSBSpeedMultiplier
    help: Show S&B speed multiplier for an actor
    args:
      - name: actor
        type: Actor
        selected: true
        required: false
        help: Target actor (defaults to player if nothing selected)
  - name: totalspeed
    alias: ts
    func: GetSBTotalSpeed
    help: Show total speed (engine speed x multiplier) for an actor
    args:
      - name: actor
        type: Actor
        selected: true
        required: false
        help: Target actor (defaults to player if nothing selected)
